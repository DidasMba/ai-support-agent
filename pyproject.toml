[project]
name = "subiza-ai"
version = "1.2.0"
description = "RAG customer-support chat agent for local businesses, built on FastAPI and Gemini on Google Cloud."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
